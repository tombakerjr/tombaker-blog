version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      production:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "typescript"
          - "wrangler"
          - "@biomejs/*"
          - "drizzle-kit"
        update-types:
          - "minor"
          - "patch"
      dev-tools:
        patterns:
          - "@types/*"
          - "typescript"
          - "wrangler"
          - "@biomejs/*"
          - "drizzle-kit"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
